services:
  - type: web
    name: openclaw
    env: docker
    plan: starter  # Disk + always-on
    dockerCommand: node dist/index.js
    envVars:
      - key: SETUP_PASSWORD
        sync: false
      - key: GATEWAY_TOKEN
        generateValue: true
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
